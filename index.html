<style>
/* Layout: three-column atlas workstation — index (left), plate/3D stage (centre), entry card (right); on phones the stage is full screen and panels become bottom sheets. */
:root {
  --paper: #e9eef0;
  --paper-2: #d7dfe3;
  --panel: #fbfcfc;
  --panel-2: #f2f5f6;
  --ink: #16212b;
  --ink-2: #4b5a68;
  --ink-3: #7b8895;
  --rule: #d4dce1;
  --accent: #1f5c88;
  --accent-soft: #dfeaf3;
  --hi: #0f9fb4;
  --ok: #2f8a4c;
  --bad: #c0392b;
  --origin: #c8413b;
  --insert: #3d67c2;
  --label-bg: rgba(251, 252, 252, 0.92);
  --f-display: "Spectral", Georgia, "Times New Roman", serif;
  --f-ui: "IBM Plex Sans", system-ui, -apple-system, "Segoe UI", Roboto, sans-serif;
  --r: 8px;
}
@media (prefers-color-scheme: dark) {
  :root:not([data-theme="light"]) {
    --paper: #0f151b; --paper-2: #1a232b; --panel: #151c23; --panel-2: #1b242c;
    --ink: #e6edf2; --ink-2: #a4b3c1; --ink-3: #74838f; --rule: #29343e;
    --accent: #79b4e3; --accent-soft: #1d3245; --hi: #3cd0e2; --ok: #58c27a; --bad: #ef6b5e;
    --origin: #ec6a63; --insert: #7c9df0; --label-bg: rgba(21, 28, 35, 0.9);
    color-scheme: dark;
  }
}
:root[data-theme="dark"] {
  --paper: #0f151b; --paper-2: #1a232b; --panel: #151c23; --panel-2: #1b242c;
  --ink: #e6edf2; --ink-2: #a4b3c1; --ink-3: #74838f; --rule: #29343e;
  --accent: #79b4e3; --accent-soft: #1d3245; --hi: #3cd0e2; --ok: #58c27a; --bad: #ef6b5e;
  --origin: #ec6a63; --insert: #7c9df0; --label-bg: rgba(21, 28, 35, 0.9);
  color-scheme: dark;
}
[hidden] { display: none !important; }
html, body { height: 100%; }
body { margin: 0; background: var(--paper); color: var(--ink); font-family: var(--f-ui); font-size: 14px; overflow: hidden; }
button { font: inherit; color: inherit; }
:focus-visible { outline: 2px solid var(--accent); outline-offset: 2px; }
#app { display: grid; grid-template-columns: 320px minmax(0, 1fr) 390px; height: 100%; }
.panel { background: var(--panel); min-width: 0; min-height: 0; display: flex; flex-direction: column; }
#left { border-right: 1px solid var(--rule); }
#right { border-left: 1px solid var(--rule); }

/* brand */
.brand { display: flex; gap: 12px; align-items: center; padding: 16px 16px 12px; border-bottom: 1px solid var(--rule); }
.brand svg { flex: none; width: 34px; height: 34px; color: var(--accent); }
.brand h1 { font-family: var(--f-display); font-weight: 600; font-size: 21px; line-height: 1.1; margin: 0; letter-spacing: 0.005em; }
.brand p { margin: 2px 0 0; color: var(--ink-3); font-size: 12px; }
.tabs { display: grid; grid-template-columns: repeat(5, 1fr); border-bottom: 1px solid var(--rule); }
.tabs button { background: none; border: 0; padding: 10px 2px 9px; font-size: 12px; font-weight: 500; color: var(--ink-2); cursor: pointer; border-bottom: 2px solid transparent; }
.tabs button[aria-selected="true"] { color: var(--accent); border-bottom-color: var(--accent); }
.tabpane { flex: 1; min-height: 0; overflow: auto; padding: 12px 16px 24px; }
.eyebrow { font-size: 11px; letter-spacing: 0.08em; text-transform: uppercase; color: var(--ink-3); font-weight: 600; margin: 14px 0 8px; }
.eyebrow:first-child { margin-top: 2px; }

/* system rows */
.sysrow { display: grid; grid-template-columns: 12px 1fr auto; gap: 10px; align-items: center; padding: 7px 0; border-bottom: 1px solid var(--rule); }
.sysrow .sw { width: 12px; height: 12px; border-radius: 3px; }
.sysrow .nm { font-weight: 500; cursor: pointer; }
.sysrow .nm small { display: block; color: var(--ink-3); font-weight: 400; font-size: 11.5px; }
.seg { display: inline-flex; border: 1px solid var(--rule); border-radius: 6px; overflow: hidden; }
.seg button { background: var(--panel); border: 0; padding: 4px 7px; cursor: pointer; color: var(--ink-3); display: grid; place-items: center; }
.seg button + button { border-left: 1px solid var(--rule); }
.seg button[aria-pressed="true"] { background: var(--accent-soft); color: var(--accent); }
.seg svg { width: 16px; height: 16px; }

/* tree */
.tree { margin-top: 6px; }
.tn { display: grid; grid-template-columns: 16px 1fr auto; align-items: center; gap: 4px; padding: 3px 4px; border-radius: 5px; cursor: pointer; line-height: 1.25; }
.tn:hover { background: var(--panel-2); }
.tn.sel { background: var(--accent-soft); color: var(--accent); }
.tn .tw { width: 16px; height: 16px; display: grid; place-items: center; color: var(--ink-3); border: 0; background: none; padding: 0; cursor: pointer; }
.tn .tw svg { width: 10px; height: 10px; transition: transform .12s; }
.tn.open > .tw svg { transform: rotate(90deg); }
.tn .lb { min-width: 0; overflow-wrap: anywhere; font-size: 13px; }
.tn .lb i { color: var(--ink-3); font-family: var(--f-display); font-size: 12px; }
.tn .eye { opacity: 0; background: none; border: 0; padding: 2px; cursor: pointer; color: var(--ink-3); display: grid; }
.tn:hover .eye, .tn .eye.off { opacity: 1; }
.tn .eye.off { color: var(--bad); }
.tn .eye svg { width: 15px; height: 15px; }
.tk { padding-left: 14px; border-left: 1px dotted var(--rule); margin-left: 7px; }

/* search */
.search { position: relative; }
.search input { width: 100%; box-sizing: border-box; padding: 10px 12px; border-radius: var(--r); border: 1px solid var(--rule); background: var(--panel-2); color: var(--ink); font: inherit; font-size: 15px; }
.res { margin-top: 10px; display: flex; flex-direction: column; }
.res button { text-align: left; background: none; border: 0; border-bottom: 1px solid var(--rule); padding: 8px 2px; cursor: pointer; display: grid; gap: 1px; }
.res button:hover { background: var(--panel-2); }
.res b { font-weight: 500; }
.res i { font-family: var(--f-display); color: var(--ink-2); font-size: 13px; }
.res span { color: var(--ink-3); font-size: 11.5px; }
.hint { color: var(--ink-3); font-size: 12.5px; line-height: 1.45; }

/* plates */
.plate { display: grid; grid-template-columns: 34px 1fr; gap: 10px; align-items: start; width: 100%; text-align: left; background: none; border: 0; border-bottom: 1px solid var(--rule); padding: 9px 2px; cursor: pointer; }
.plate:hover { background: var(--panel-2); }
.plate .no { font-family: var(--f-display); font-size: 15px; color: var(--accent); text-align: right; font-variant-numeric: tabular-nums; }
.plate b { display: block; font-weight: 500; }
.plate span { color: var(--ink-3); font-size: 12px; }
.plate.on { background: var(--accent-soft); }

/* learn */
.qopts { display: grid; gap: 8px; }
.chips { display: flex; flex-wrap: wrap; gap: 6px; }
.chip { border: 1px solid var(--rule); background: var(--panel); border-radius: 999px; padding: 5px 11px; cursor: pointer; font-size: 12.5px; }
.chip[aria-pressed="true"] { background: var(--accent); border-color: var(--accent); color: var(--panel); }
.btn { border: 1px solid var(--accent); background: var(--accent); color: var(--panel); border-radius: var(--r); padding: 9px 14px; cursor: pointer; font-weight: 500; }
.btn.ghost { background: transparent; color: var(--accent); }
.btn:disabled { opacity: .5; cursor: default; }
.score { display: grid; grid-template-columns: repeat(3, 1fr); gap: 8px; margin: 12px 0; }
.score div { border: 1px solid var(--rule); border-radius: var(--r); padding: 8px; text-align: center; }
.score b { display: block; font-family: var(--f-display); font-size: 22px; font-variant-numeric: tabular-nums; }
.score span { font-size: 11px; color: var(--ink-3); text-transform: uppercase; letter-spacing: .06em; }
.answers { display: grid; gap: 6px; margin-top: 10px; }
.answers button { text-align: left; border: 1px solid var(--rule); background: var(--panel); border-radius: var(--r); padding: 9px 11px; cursor: pointer; }
.answers button:hover { border-color: var(--accent); }
.answers button.good { border-color: var(--ok); background: color-mix(in srgb, var(--ok) 14%, var(--panel)); }
.answers button.badc { border-color: var(--bad); background: color-mix(in srgb, var(--bad) 12%, var(--panel)); }
.qprompt { font-family: var(--f-display); font-size: 19px; line-height: 1.25; margin: 6px 0 2px; }
.qfeedback { min-height: 20px; font-size: 13px; margin-top: 8px; }
.qfeedback.good { color: var(--ok); } .qfeedback.badc { color: var(--bad); }

/* stage */
#stage { position: relative; min-width: 0; overflow: hidden; background: radial-gradient(ellipse at 50% 42%, var(--panel) 0%, var(--paper) 55%, var(--paper-2) 100%); }
#stage { container-type: inline-size; }
@container (max-width: 860px) { #bUndo .txt, #bReset .txt { display: none; } .toolbar .tgroup button { padding: 6px 7px; } .toolbar .tgroup .sel { padding-left: 7px; } }
#c { position: absolute; inset: 0; width: 100%; height: 100%; display: block; touch-action: none; }
#lines { position: absolute; inset: 0; width: 100%; height: 100%; pointer-events: none; transition: opacity .15s; }
#pins { position: absolute; inset: 0; width: 100%; height: 100%; pointer-events: none; }
#pins .pin circle { stroke: #fff; stroke-width: 2; }
#pins .pin text { font: 700 11px/1 var(--f-ui); fill: #fff; text-anchor: middle; dominant-baseline: central; }
#pins .pin.site circle.halo { fill: none; stroke-width: 2.5; stroke-dasharray: 3 3; }
.lbl.pinlbl { font-weight: 500; cursor: default; }
.lbl .pn { display: inline-grid; place-items: center; min-width: 17px; height: 17px; padding: 0 3px; border-radius: 9px; color: #fff; font-size: 10.5px; font-weight: 700; margin-right: 4px; vertical-align: 1px; }
#lines .pinl line { stroke-width: 1.1; opacity: .9; }
/* clinical plate info in the card panel */
.pinfo-legend { display: flex; flex-wrap: wrap; gap: 6px 12px; margin-top: 10px; font-size: 12px; color: var(--ink-2); }
.pinfo-legend span { display: inline-flex; align-items: center; gap: 5px; }
.pinfo-legend i { width: 12px; height: 12px; border-radius: 50%; display: inline-block; }
.pinlist { list-style: none; padding: 0; margin: 0; }
.pinlist li { display: grid; grid-template-columns: 26px 1fr; gap: 6px; align-items: start; margin: 5px 0; font-size: 13.5px; line-height: 1.35; }
.pinlist .pn { display: inline-grid; place-items: center; min-width: 20px; height: 20px; border-radius: 10px; color: #fff; font-size: 11px; font-weight: 700; }
#platebar .more { margin-top: 6px; border: 1px solid var(--rule); background: var(--panel-2); border-radius: 999px; padding: 4px 10px; font: inherit; font-size: 12px; cursor: pointer; color: var(--ink); }
#labels { position: absolute; inset: 0; pointer-events: none; transition: opacity .15s; }
.moving #lines, .moving #labels { opacity: 0; }
.lbl { position: absolute; max-width: 190px; font-size: 12px; line-height: 1.2; color: var(--ink); pointer-events: auto; cursor: pointer; padding: 1px 3px; border-radius: 3px; background: var(--label-bg); }
.lbl.r { text-align: left; } .lbl.l { text-align: right; }
.lbl i { display: block; font-family: var(--f-display); font-size: 11.5px; color: var(--ink-2); }
.lbl.cur { color: var(--hi); font-weight: 600; }
.lbl.num { font-weight: 600; font-variant-numeric: tabular-nums; min-width: 14px; text-align: center; border: 1px solid var(--ink-3); border-radius: 999px; padding: 0 5px; }
.lbl.num.rev { font-weight: 500; text-align: left; border-radius: 4px; }
#lines line { stroke: var(--ink); stroke-width: 0.8; opacity: .75; }
#lines circle { fill: var(--ink); }
#lines .cur line, #lines .cur circle { stroke: var(--hi); fill: var(--hi); opacity: 1; }
#tip { position: absolute; pointer-events: none; background: var(--ink); color: var(--panel); padding: 4px 8px; border-radius: 5px; font-size: 12px; white-space: nowrap; transform: translate(12px, 12px); z-index: 5; }
.toolbar { position: absolute; top: 12px; left: 12px; right: 12px; display: flex; flex-wrap: wrap; gap: 6px; align-items: center; pointer-events: none; z-index: 4; }
.toolbar > * { pointer-events: auto; }
.tgroup { display: inline-flex; background: var(--panel); border: 1px solid var(--rule); border-radius: var(--r); overflow: hidden; box-shadow: 0 1px 2px rgba(0,0,0,.05); }
.tgroup button { background: none; border: 0; padding: 6px 9px; cursor: pointer; font-size: 12.5px; color: var(--ink-2); display: inline-flex; align-items: center; gap: 5px; }
.tgroup button + button { border-left: 1px solid var(--rule); }
.tgroup button:hover { color: var(--ink); background: var(--panel-2); }
.tgroup button[aria-pressed="true"] { color: var(--accent); background: var(--accent-soft); }
.tgroup svg { width: 15px; height: 15px; }

function plainTxt(t) {
  return t.replace(/\[\[([a-z0-9_.]+)(?:\|([^\]]+))?\]\]/g, (_, b, l) => l || (baseToName.has(b) ? pl(baseToName.get(b)).toLowerCase() : b))

}

}

// --- learning statistics: Leitner boxes per question (1 = often wrong ... 5 = well known) ---
const qstats = store.get('qstats', {});
const statKey = (u) => quiz.scope + '|' + u.key;
function recordStat(u, ok) {
  const k = statKey(u); const st = qstats[k] || [0, 0, 1, 0]; // [seen, wrong, box, last]
  st[0]++; if (ok) st[2] = Math.min(5, st[2] + 1); else { st[1]++; st[2] = 1; } st[3] = Date.now();
  qstats[k] = st; store.set('qstats', qstats);
}

function pickUnit() {
  let pool = quiz.units.filter((u) => !quiz.skip.has(u.key)); if (!pool.length) return null;
  if (quiz.exam) { const asked = new Set(quiz.exam.log.map((x) => x.key)); const fresh = pool.filter((u) => !asked.has(u.key)); if (fresh.length) pool = fresh; }
  const cand = pool.filter((u) => !quiz.recent.includes(u.key)); const P = cand.length ? cand : pool;
  // mistakes come back more often, well-known structures less often
  const w = P.map((u) => { const st = qstats[statKey(u)]; return quiz.exam ? 1 : st ? BOX_W[st[2]] : 2.5; });
  let r = Math.random() * w.reduce((a, b) => a + b, 0), u = P[P.length - 1];
  for (let i = 0; i < P.length; i++) { r -= w[i]; if (r <= 0) { u = P[i]; break; } }

function refreshTools() { const t = $('#quizcard .qc-tools'); if (t && quiz.mode !== 'latin') t.outerHTML = quizTools(); }
controls.addEventListener('start', () => { if (quiz.active && quiz.answered) clearTimeout(quiz.timer); }); // exploring the answer – no auto-advance
function quizKey(k) {
  if (!quiz.cur) return false;
  if (!quiz.answered && quiz.mode !== 'point' && /^[1-4]$/.test(k)) { quizChoose(+k - 1); return true; }
  if (quiz.answered && !quiz.exam && (k === 'enter' || k === ' ' || k === 'arrowright')) { nextQuestion(); return true; }
  return false;
}
function scoreUpdate(ok) {
  if (quiz.cur && quiz.cur.u) recordStat(quiz.cur.u, ok);
  quiz.total++; if (ok) { quiz.good++; quiz.streak++; } else quiz.streak = 0;
  const best = store.get('best', {}); const key = bestKey();
  if (quiz.streak > (best[key] || 0)) { best[key] = quiz.streak; store.set('best', best); }
  if ($('#qs-good')) { $('#qs-good').textContent = quiz.good; $('#qs-total').textContent = quiz.total; $('#qs-streak').textContent = quiz.streak; }
}
function quizChoose(i) {
  const c = quiz.cur; if (!c || quiz.answered || !c.opts || !c.opts[i]) return;
  const f = quiz.mode === 'latin' ? (c.rev ? (x) => x.label : (x) => x.la) : (x) => x.label;
  const x = c.opts[i], ok = x === c.u || f(x) === f(c.u);
  if (quiz.exam) { examAnswer(ok, f(x)); return; }
  quiz.answered = true;
  scoreUpdate(ok);
  $$('#quizcard .qc-ans button').forEach((b) => { b.disabled = true; const y = c.opts[+b.dataset.i]; if (y === c.u) b.classList.add('good'); else if (+b.dataset.i === i) b.classList.add('badc'); });
  if (quiz.mode === 'name') setMarks([{ key: 't', meshes: structMeshes(c.si), html: esc(c.u.label), bad: false }]);
  quizFeedback(ok, null);
}
function quizAnswerPoint(m) {
  if (quiz.answered || m < 0 || !quiz.cur) return;
  const csi = meshToStruct[m], ok = quiz.cur.u.names.has(ST[csi][1]);
  if (quiz.exam) { examAnswer(ok, pl(ST[csi][1])); return; }
  quiz.answered = true; scoreUpdate(ok);
  quizReveal(ok ? csi : -1, ok ? null : csi);
}
function quizReveal(hitSi, wrongSi) {
  const c = quiz.cur; if (!c) return;
  if (hitSi < 0 && wrongSi == null) { if (quiz.answered) return; quiz.answered = true; scoreUpdate(false); }
  const ok = hitSi >= 0, show = ok ? hitSi : c.si;
  if (ok) c.si = hitSi;
  clearSel();
  const tm = structMeshes(show); for (const m of tm) { sel[m] = 1; if (!vis[m]) vis[m] = 1; }
  const marks = [{ key: 't', meshes: tm, html: esc(c.u.label) }];
  const wm = wrongSi != null ? structMeshes(wrongSi) : [];
  for (const m of wm) ovr.set([70, 80, 107], m * 3); // the wrongly chosen structure: dark slate, label in red
  if (wm.length) marks.push({ key: 'w', meshes: wm, html: esc(pl(ST[wrongSi][1])), bad: true });
  refreshState(); setMarks(marks);
  if (!ok) {
    const box = contextBox(show); if (wm.length) box.union(bboxOf(wm));
    const ev = evalViews(tm, box, 1.15);
    if (ev) { ghostOccluders(ev, new Set(wm)); quiz.frame = { box, dir: ev.dir, pad: 1.15, ev }; flyTo(box, ev.dir, 1.15, 700); }
  }
  quizFeedback(ok, wm.length ? ST[wrongSi][1] : null);
}
function quizFeedback(ok, wrongName) {
  const c = quiz.cur, u = c.u, card = $('#quizcard');
  card.classList.add(ok ? 'good' : 'bad');
  $('.qc-top', card).innerHTML = quizMeta();
  let h = ok ? '<b>Dobrze!</b> ' : wrongName != null ? `<b>Nie</b> – to jest ${esc(pl(wrongName))}. Szukana: ` : quiz.mode === 'point' ? 'Szukana struktura: ' : '<b>Nie.</b> Poprawnie: ';
  h += `<b>${esc(u.label)}</b>` + (u.la ? ` – <i>${esc(u.la)}</i>` : '');
  const exact = pl(ST[c.si][1]);
  if (quiz.mode !== 'latin' && exact !== u.label) h += `<br><span style="color:var(--ink-2)">Na modelu: ${esc(exact)}${ST[c.si][5] ? (ST[c.si][5] === 1 ? ', strona lewa' : ', strona prawa') : ''}</span>`;
  const fact = quiz.mode !== 'latin' ? quizFact(c.si) : '';
  const fb = $('.qc-fb', card); fb.className = 'qc-fb ' + (ok ? 'good' : 'badc'); fb.innerHTML = h + fact;
  refreshTools();
  $('.qc-act', card).innerHTML = (quiz.mode !== 'latin' ? '<button class="btn ghost" data-q="card">Karta struktury</button>' : '') + '<button class="btn" data-q="next">Dalej →</button>';
  updateInsets(); scheduleLabels(0);
  if (ok) quiz.timer = setTimeout(() => { if (quiz.active && quiz.answered) nextQuestion(); }, fact ? 4200 : 1800);
}
function quizShowCard() {
  clearTimeout(quiz.timer); const c = quiz.cur; if (!c) return;
  selNode = ST[c.si][1]; selStruct = c.si; renderCard(); highlightTree();
  if (isMobile()) openSheet('card');
}

/* ---------------- mobile sheets ---------------- */
function openSheet(which) {
  if (!isMobile()) return;
  const left = $('#left'), right = $('#right');
  if (which === 'card') { left.classList.remove('open'); right.classList.add('open'); }
  else { right.classList.remove('open'); left.classList.add('open'); showTab(which); }
  $$('#mobilebar button').forEach((b) => setPressed(b, b.dataset.m === which));
}
function closeSheets() { $('#left').classList.remove('open'); $('#right').classList.remove('open'); $$('#mobilebar button').forEach((b) => setPressed(b, false)); }
$$('#mobilebar button').forEach((b) => b.addEventListener('click', () => { const open = b.getAttribute('aria-pressed') === 'true'; if (open) closeSheets(); else openSheet(b.dataset.m); }));
$$('[data-close]').forEach((b) => b.addEventListener('click', closeSheets));

buildSystems(); buildPlates(); buildLearn(); renderCard();
defaultVisibility();
camera.position.set(0, 0.95, 4.2); controls.target.set(0, 0.88, 0.05); controls.update();

window.__atlasReady = true;
window.__quizDebug = () => quiz.cur && { label: quiz.cur.u.label, exact: pl(ST[quiz.cur.si][1]), frac: quiz.frame && quiz.frame.ev ? +quiz.frame.ev.frac.toFixed(2) : null, dir: quiz.frame ? quiz.frame.dir : null, units: quiz.units.length, inset: { ...inset } };
await loadChunks();
